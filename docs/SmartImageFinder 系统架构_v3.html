<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartImageFinder 项目架构图</title>
    <style>
        body {
            margin: 0;
            background-color: #080B11;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        svg {
            background: linear-gradient(135deg, #0A1625 0%, #0D1B2A 100%);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        @keyframes glowing {
            0% { filter: drop-shadow(0 0 2px rgba(138,43,226,0.2)); }
            50% { filter: drop-shadow(0 0 8px rgba(138,43,226,0.4)); }
            100% { filter: drop-shadow(0 0 2px rgba(138,43,226,0.2)); }
        }
        .glow-effect {
            animation: glowing 3s ease-in-out infinite;
        }
        .title-group {
            filter: drop-shadow(0 0 8px rgba(147,112,219,0.4));
        }
    </style>
</head>
<body>
    <svg width="1200" height="1500" viewBox="0 0 1200 1500">
        <defs>
            <!-- 渐变定义 -->
            <linearGradient id="header-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#4B0082;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="frontend-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#1E3B8C;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#2E5CB8;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="backend-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#4A1B7A;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#6A3AA6;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="db-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#1B4B78;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#2E6BA4;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#561B7A;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#7A3AA6;stop-opacity:1" />
            </linearGradient>
            
            <!-- 发光滤镜 -->
            <filter id="glow" height="300%" width="300%" x="-100%" y="-100%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- 阴影滤镜 -->
            <filter id="shadow" height="200%" width="200%" x="-50%" y="-50%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
            </filter>

            <!-- 箭头标记 -->
            <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" 
                markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#BD93F9"/>
            </marker>
            <marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" 
                markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#A569BD"/>
            </marker>
        </defs>

        <!-- 标题区 -->
        <g class="title-group">
            <rect x="250" y="30" width="700" height="60" rx="30" ry="30" 
                fill="url(#header-gradient)" filter="url(#shadow)"/>
            <text x="600" y="70" text-anchor="middle" fill="#FFFFFF" 
                font-size="28" font-weight="bold" letter-spacing="2">
                SmartImageFinder 智能图片搜索系统
            </text>
        </g>

        <!-- 前端模块 -->
        <g transform="translate(0,120)" class="glow-effect">
            <rect x="350" y="0" width="500" height="180" rx="15" ry="15" 
                fill="url(#frontend-gradient)" stroke="#81A1C1" stroke-width="2" filter="url(#shadow)"/>
            <text x="600" y="35" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold">
                前端 (React + Ant Design)
            </text>
            <g transform="translate(370,60)">
                <rect x="0" y="0" width="220" height="100" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#81A1C1" stroke-width="1"/>
                <text x="110" y="25" text-anchor="middle" fill="#E6E6FA" font-size="14">界面组件</text>
                <text x="20" y="50" fill="#E6E6FA" font-size="12">• 图片管理页面</text>
                <text x="20" y="70" fill="#E6E6FA" font-size="12">• 图片上传与编辑</text>
                <text x="20" y="90" fill="#E6E6FA" font-size="12">• 搜索界面</text>
            </g>
            <g transform="translate(610,60)">
                <rect x="0" y="0" width="220" height="100" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#81A1C1" stroke-width="1"/>
                <text x="110" y="25" text-anchor="middle" fill="#E6E6FA" font-size="14">功能模块</text>
                <text x="20" y="50" fill="#E6E6FA" font-size="12">• 状态管理 (Zustand)</text>
                <text x="20" y="70" fill="#E6E6FA" font-size="12">• API 请求封装</text>
                <text x="20" y="90" fill="#E6E6FA" font-size="12">• 图片预览与处理</text>
            </g>
        </g>

        <!-- 后端核心 -->
        <g transform="translate(0,360)" class="glow-effect">
            <rect x="350" y="0" width="500" height="180" rx="15" ry="15" 
                fill="url(#backend-gradient)" stroke="#B39DDB" stroke-width="2" filter="url(#shadow)"/>
            <text x="600" y="35" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold">
                后端核心 (FastAPI)
            </text>
            <g transform="translate(370,60)">
                <rect x="0" y="0" width="220" height="100" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#B39DDB" stroke-width="1"/>
                <text x="110" y="25" text-anchor="middle" fill="#E6E6FA" font-size="14">API 路由</text>
                <text x="20" y="50" fill="#E6E6FA" font-size="12">• 图片管理接口</text>
                <text x="20" y="70" fill="#E6E6FA" font-size="12">• 搜索接口</text>
                <text x="20" y="90" fill="#E6E6FA" font-size="12">• 系统管理接口</text>
            </g>
            <g transform="translate(610,60)">
                <rect x="0" y="0" width="220" height="100" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#B39DDB" stroke-width="1"/>
                <text x="110" y="25" text-anchor="middle" fill="#E6E6FA" font-size="14">功能模块</text>
                <text x="20" y="50" fill="#E6E6FA" font-size="12">• 请求验证</text>
                <text x="20" y="70" fill="#E6E6FA" font-size="12">• 异常处理</text>
                <text x="20" y="90" fill="#E6E6FA" font-size="12">• 中间件</text>
            </g>
        </g>

        <!-- 数据库层 -->
        <g transform="translate(0,600)" class="glow-effect">
            <rect x="50" y="0" width="340" height="160" rx="15" ry="15" 
                fill="url(#db-gradient)" stroke="#81A1C1" stroke-width="2" filter="url(#shadow)"/>
            <text x="220" y="35" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">
                数据库 (SQLite + sqlite-vec)
            </text>
            <g transform="translate(70,60)">
                <rect x="0" y="0" width="300" height="80" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#81A1C1" stroke-width="1"/>
                <text x="20" y="25" fill="#E6E6FA" font-size="12">• 图片元数据表</text>
                <text x="20" y="45" fill="#E6E6FA" font-size="12">• 向量存储表 (标题、描述、图像特征)</text>
                <text x="20" y="65" fill="#E6E6FA" font-size="12">• 标签关系表</text>
            </g>
        </g>

        <!-- AI 服务层 -->
        <g transform="translate(430,600)" class="glow-effect">
            <rect x="0" y="0" width="340" height="160" rx="15" ry="15" 
                fill="url(#ai-gradient)" stroke="#B39DDB" stroke-width="2" filter="url(#shadow)"/>
            <text x="170" y="35" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">
                AI 模型服务
            </text>
            <g transform="translate(20,60)">
                <rect x="0" y="0" width="300" height="80" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#B39DDB" stroke-width="1"/>
                <text x="20" y="25" fill="#E6E6FA" font-size="12">• Jina CLIP V2 (图文特征提取)</text>
                <text x="20" y="45" fill="#E6E6FA" font-size="12">• 多模态内容生成 API</text>
                <text x="20" y="65" fill="#E6E6FA" font-size="12">• 向量化与相似度计算</text>
            </g>
        </g>

        <!-- 文件系统层 -->
        <g transform="translate(810,600)" class="glow-effect">
            <rect x="0" y="0" width="340" height="160" rx="15" ry="15" 
                fill="url(#db-gradient)" stroke="#81A1C1" stroke-width="2" filter="url(#shadow)"/>
            <text x="170" y="35" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">
                文件系统
            </text>
            <g transform="translate(20,60)">
                <rect x="0" y="0" width="300" height="80" rx="8" ry="8" 
                    fill="rgba(255,255,255,0.1)" stroke="#81A1C1" stroke-width="1"/>
                <text x="20" y="25" fill="#E6E6FA" font-size="12">• 图片文件存储</text>
                <text x="20" y="45" fill="#E6E6FA" font-size="12">• 缓存管理</text>
                <text x="20" y="65" fill="#E6E6FA" font-size="12">• 文件组织结构</text>
            </g>
        </g>

        <!-- 后端功能层 -->
        <g transform="translate(0,820)">
            <rect x="50" y="0" width="1100" height="500" rx="15" ry="15" 
                fill="rgba(74, 35, 90, 0.3)" stroke="#B39DDB" stroke-width="2" 
                stroke-dasharray="5,5" filter="url(#shadow)"/>
            <text x="600" y="35" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold">
                后端功能模块
            </text>

            <!-- 功能模块 -->
            <g transform="translate(70,60)">
                <rect x="0" y="0" width="250" height="180" rx="10" ry="10" 
                    fill="rgba(41, 128, 185, 0.2)" stroke="#81A1C1" stroke-width="1"/>
                <text x="125" y="30" text-anchor="middle" fill="#E6E6FA" font-size="16" font-weight="bold">
                    AI 功能层 (ai_func)
                </text>
                <text x="20" y="60" fill="#E6E6FA" font-size="12">• 图像分析与特征提取</text>
                <text x="20" y="85" fill="#E6E6FA" font-size="12">• 文本向量化</text>
                <text x="20" y="110" fill="#E6E6FA" font-size="12">• 元数据生成</text>
                <text x="20" y="135" fill="#E6E6FA" font-size="12">• 相似度计算</text>
                <text x="20" y="160" fill="#E6E6FA" font-size="12">• AI 模型调用封装</text>
            </g>

            <g transform="translate(340,60)">
                <rect x="0" y="0" width="250" height="180" rx="10" ry="10" 
                    fill="rgba(142, 68, 173, 0.2)" stroke="#B39DDB" stroke-width="1"/>
                <text x="125" y="30" text-anchor="middle" fill="#E6E6FA" font-size="16" font-weight="bold">
                    数据库功能层 (db_func)
                </text>
                <text x="20" y="60" fill="#E6E6FA" font-size="12">• 数据库连接池</text>
                <text x="20" y="85" fill="#E6E6FA" font-size="12">• CRUD 操作封装</text>
                <text x="20" y="110" fill="#E6E6FA" font-size="12">• 向量搜索实现</text>
                <text x="20" y="135" fill="#E6E6FA" font-size="12">• 事务管理</text>
                <text x="20" y="160" fill="#E6E6FA" font-size="12">• 查询优化</text>
            </g>

            <g transform="translate(610,60)">
                <rect x="0" y="0" width="250" height="180" rx="10" ry="10" 
                    fill="rgba(41, 128, 185, 0.2)" stroke="#81A1C1" stroke-width="1"/>
                <text x="125" y="30" text-anchor="middle" fill="#E6E6FA" font-size="16" font-weight="bold">
                    系统功能层 (system_fun)
                </text>
                <text x="20" y="60" fill="#E6E6FA" font-size="12">• 配置管理</text>
                <text x="20" y="85" fill="#E6E6FA" font-size="12">• 缓存管理</text>
                <text x="20" y="110" fill="#E6E6FA" font-size="12">• 运行时管理</text>
                <text x="20" y="135" fill="#E6E6FA" font-size="12">• 数据库管理</text>
                <text x="20" y="160" fill="#E6E6FA" font-size="12">• 系统监控</text>
            </g>

            <g transform="translate(880,60)">
                <rect x="0" y="0" width="250" height="180" rx="10" ry="10" 
                    fill="rgba(142, 68, 173, 0.2)" stroke="#B39DDB" stroke-width="1"/>
                <text x="125" y="30" text-anchor="middle" fill="#E6E6FA" font-size="16" font-weight="bold">
                    工具层 (utils)
                </text>
                <text x="20" y="60" fill="#E6E6FA" font-size="12">• 图像处理工具</text>
                <text x="20" y="85" fill="#E6E6FA" font-size="12">• 文本处理工具</text>
                <text x="20" y="110" fill="#E6E6FA" font-size="12">• 向量生成工具</text>
                <text x="20" y="135" fill="#E6E6FA" font-size="12">• 文件操作工具</text>
                <text x="20" y="160" fill="#E6E6FA" font-size="12">• 通用辅助函数</text>
            </g>

            <!-- 底层支持模块 -->
            <g transform="translate(70,270)">
                <rect x="0" y="0" width="520" height="100" rx="10" ry="10" 
                    fill="rgba(41, 128, 185, 0.2)" stroke="#81A1C1" stroke-width="1"/>
                <text x="260" y="30" text-anchor="middle" fill="#E6E6FA" font-size="16" font-weight="bold">
                    数据库连接池 (connection_pool.py)
                </text>
                <text x="20" y="60" fill="#E6E6FA" font-size="12">• 连接池初始化与管理</text>
                <text x="20" y="85" fill="#E6E6FA" font-size="12">• 连接的获取与释放</text>
                <text x="280" y="60" fill="#E6E6FA" font-size="12">• 连接池状态监控</text>
                <text x="280" y="85" fill="#E6E6FA" font-size="12">• 连接重试与错误处理</text>
            </g>

            <g transform="translate(610,270)">
                <rect x="0" y="0" width="520" height="100" rx="10" ry="10" 
                    fill="rgba(142, 68, 173, 0.2)" stroke="#B39DDB" stroke-width="1"/>
                <text x="260" y="30" text-anchor="middle" fill="#E6E6FA" font-size="16" font-weight="bold">
                    配置模块 (config.py)
                </text>
                <text x="20" y="60" fill="#E6E6FA" font-size="12">• 配置文件加载与验证</text>
                <text x="20" y="85" fill="#E6E6FA" font-size="12">• 环境变量管理</text>
                <text x="280" y="60" fill="#E6E6FA" font-size="12">• 动态配置更新</text>
                <text x="280" y="85" fill="#E6E6FA" font-size="12">• 配置项验证</text>
            </g>

            <!-- FastAPI 应用入口 -->
            <g transform="translate(300,400)">
                <rect x="0" y="0" width="600" height="70" rx="10" ry="10" 
                    fill="rgba(147, 112, 219, 0.2)" stroke="#B39DDB" stroke-width="1" 
                    stroke-dasharray="4,4"/>
                <text x="300" y="30" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">
                    FastAPI 应用入口 (main.py)
                </text>
                <text x="300" y="55" text-anchor="middle" fill="#E6E6FA" font-size="12">
                    应用初始化、路由注册、中间件配置、依赖注入
                </text>
            </g>
        </g>

        <!-- 连接线 -->
        <!-- 前端到后端 -->
        <path d="M 600 300 L 600 360" stroke="#BD93F9" stroke-width="2" 
            marker-end="url(#arrow-main)" fill="none"/>
        <text x="640" y="330" fill="#E6E6FA" font-size="12">HTTP/REST API</text>

        <!-- 后端到服务层 -->
        <path d="M 550 540 L 220 600" stroke="#BD93F9" stroke-width="2" 
            marker-end="url(#arrow-main)" fill="none"/>
        <path d="M 600 540 L 600 600" stroke="#BD93F9" stroke-width="2" 
            marker-end="url(#arrow-main)" fill="none"/>
        <path d="M 650 540 L 980 600" stroke="#BD93F9" stroke-width="2" 
            marker-end="url(#arrow-main)" fill="none"/>


    </svg>
</body>
</html>
