<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartImageFinder 系统架构</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; padding: 20px; box-sizing: border-box; } /* Slightly different bg */
        .svg-container { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); } /* Enhanced shadow and radius */
    </style>
</head>
<body>
    <div class="svg-container">
        <svg width="1100" height="900" viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#607D8B" />
                </marker>
                <marker id="arrowhead-start" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                    <polygon points="10 3.5, 0 0, 0 7" fill="#607D8B" />
                </marker>

                <!-- Gradients - Updated Palette -->
                <linearGradient id="gradUser" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" /> <!-- User: Gold/Yellow -->
                    <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradFrontendNew" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:1" /> <!-- Frontend: Bright Blue -->
                    <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradBackendNew" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#4A235A;stop-opacity:1" /> <!-- Backend: Deep Purple -->
                    <stop offset="100%" style="stop-color:#3B1F4A;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradDbNew" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#AAB7B8;stop-opacity:1" /> <!-- DB: Cool Grey -->
                    <stop offset="100%" style="stop-color:#95A5A6;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradModelNew" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#48C9B0;stop-opacity:1" /> <!-- Model: Teal -->
                    <stop offset="100%" style="stop-color:#1ABC9C;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradApiNew" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#AF7AC5;stop-opacity:1" /> <!-- API: Lavender/Purple -->
                    <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradStorageNew" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#CACFD2;stop-opacity:1" /> <!-- Storage: Light Grey -->
                    <stop offset="100%" style="stop-color:#BDC3C7;stop-opacity:1" />
                </linearGradient>

                <!-- Drop Shadow Filter -->
                <filter id="dropshadow" height="130%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                    <feOffset dx="2" dy="3" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode in="offsetblur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Styles -->
            <style>
                .box { stroke: #455A64; stroke-width: 1; rx: 10; ry: 10; } /* Increased rx/ry */
                .main-text { font-size: 15px; font-weight: bold; text-anchor: middle; }
                .sub-text { font-size: 11px; text-anchor: middle; }
                .desc-text { font-size: 10px; fill: #37474F; text-anchor: middle; font-style: italic; }
                .module-text { font-size: 12px; fill: #FFFFFF; text-anchor: start; } /* Align module text to start */
                .connector { stroke: #78909C; stroke-width: 1.5; fill: none; } /* Default connector without arrowhead */
                .arrowed-connector { stroke: #78909C; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
                .bi-connector { stroke: #78909C; stroke-width: 1.5; marker-end: url(#arrowhead); marker-start: url(#arrowhead-start); }

                /* Internal blocks style */
                .internal-box { stroke: #FFFFFF; stroke-width: 0.7; rx: 6; ry: 6; fill: #FFFFFF; fill-opacity: 0.15; }
                .internal-main-text { font-size: 11px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
                .internal-sub-text { font-size: 9px; fill: #EAECEE; text-anchor: middle; } /* Lighter sub-text for dark bgs */

                .frontend-internal-box { stroke: #2E86C1; fill: #FFFFFF; fill-opacity: 0.2; } /* Frontend internal box with its theme */
                .frontend-internal-main-text { font-size: 11px; font-weight: bold; fill: #1A5276; text-anchor: middle; }
                .frontend-internal-sub-text { font-size: 9px; fill: #2471A3; text-anchor: middle; }
                
                /* Styles for internal blocks in bottom components */
                .bottom-internal-box { stroke-width: 0.7; rx: 6; ry: 6; fill-opacity: 0.2; }
                .bottom-internal-main-text { font-size: 10px; font-weight: bold; text-anchor: middle; }
                .bottom-internal-sub-text { font-size: 8px; text-anchor: middle; }

                /* Fill classes using new gradients */
                .user-color { fill: url(#gradUser); }
                .frontend-color-new { fill: url(#gradFrontendNew); }
                .backend-color-new { fill: url(#gradBackendNew); }
                .db-color-new { fill: url(#gradDbNew); }
                .model-color-new { fill: url(#gradModelNew); }
                .api-color-new { fill: url(#gradApiNew); }
                .storage-color-new { fill: url(#gradStorageNew); }

                /* Text colors based on new backgrounds */
                .user-color .main-text { fill: #4E342E; }
                .frontend-color-new .main-text { fill: #FFFFFF; }
                .frontend-color-new .sub-text { fill: #F0F0F0; }
                .backend-color-new .main-text, .backend-color-new .sub-text { fill: #FFFFFF; }
                
                .db-color-new .main-text, .db-color-new .sub-text { fill: #2C3E50; }
                .db-color-new .bottom-internal-main-text, .db-color-new .bottom-internal-sub-text { fill: #212F3C; }
                .db-color-new .bottom-internal-box { stroke: #2C3E50; fill: #FFFFFF; }

                .model-color-new .main-text, .model-color-new .sub-text { fill: #FFFFFF; }
                .model-color-new .bottom-internal-main-text, .model-color-new .bottom-internal-sub-text { fill: #F7F9F9; }
                .model-color-new .bottom-internal-box { stroke: #F7F9F9; fill: #FFFFFF; fill-opacity: 0.1; }


                .api-color-new .main-text, .api-color-new .sub-text { fill: #FFFFFF; }
                .api-color-new .bottom-internal-main-text, .api-color-new .bottom-internal-sub-text { fill: #FDFAFf; }
                .api-color-new .bottom-internal-box { stroke: #FDFAFF; fill: #FFFFFF; fill-opacity: 0.15; }

                .storage-color-new .main-text, .storage-color-new .sub-text { fill: #283747; }
                .storage-color-new .bottom-internal-main-text, .storage-color-new .bottom-internal-sub-text { fill: #1B2631; }
                .storage-color-new .bottom-internal-box { stroke: #1B2631; fill: #FFFFFF; }

                /* Apply shadow to main component boxes */
                .user-color, .frontend-color-new, .backend-color-new, .db-color-new, .model-color-new, .api-color-new, .storage-color-new {
                    filter: url(#dropshadow);
                }
            </style>

            <!-- Components -->
            <!-- User -->
            <rect x="475" y="20" width="150" height="60" class="box user-color" />
            <text x="550" y="43" class="main-text" fill="#4E342E">用户 (User)</text>

            <!-- Frontend -->
            <g class="frontend-color-new" filter="url(#dropshadow)">
                <rect x="300" y="110" width="500" height="110" class="box" />
                <text x="550" y="135" class="main-text">前端 (Frontend)</text>
                <!-- Internal Frontend Blocks -->
                <rect x="320" y="155" width="220" height="50" class="frontend-internal-box" />
                <text x="430" y="175" class="frontend-internal-main-text">React</text>
                <text x="430" y="190" class="frontend-internal-sub-text">UI 组件, 状态管理</text>

                <rect x="560" y="155" width="220" height="50" class="frontend-internal-box" />
                <text x="670" y="175" class="frontend-internal-main-text">Ant Design</text>
                <text x="670" y="190" class="frontend-internal-sub-text">UI 库, 设计规范</text>
            </g>

            <!-- Backend API -->
            <g class="backend-color-new" filter="url(#dropshadow)">
                <rect x="150" y="250" width="800" height="280" class="box" />
                <text x="550" y="280" class="main-text">后端 API (Backend API)</text>
                <text x="550" y="300" class="sub-text">FastAPI</text>

                <!-- Internal Backend Modules - Adjusted for alignment -->
                <rect x="200" y="325" width="200" height="65" class="internal-box" />
                <text x="300" y="348" class="internal-main-text">检索模块</text>
                <text x="300" y="363" class="internal-sub-text">非向量/向量/混合</text>

                <rect x="450" y="325" width="200" height="65" class="internal-box" />
                <text x="550" y="348" class="internal-main-text">图片管理模块</text>
                <text x="550" y="363" class="internal-sub-text">元数据, 标签, 批量</text>

                <rect x="700" y="325" width="200" height="65" class="internal-box" />
                <text x="800" y="348" class="internal-main-text">上传与处理模块</text>
                <text x="800" y="363" class="internal-sub-text">批量上传, 智能分析</text>

                <rect x="200" y="405" width="200" height="65" class="internal-box" />
                <text x="300" y="428" class="internal-main-text">多模态生成模块</text>
                <text x="300" y="443" class="internal-sub-text">标题, 描述, 标签</text>
                
                <rect x="450" y="405" width="200" height="65" class="internal-box" />
                <text x="550" y="428" class="internal-main-text">系统管理模块</text>
                <text x="550" y="443" class="internal-sub-text">配置, 监控, 缓存</text>

                <rect x="700" y="405" width="200" height="65" class="internal-box" />
                <text x="800" y="428" class="internal-main-text">数据入库与存储</text>
                <text x="800" y="443" class="internal-sub-text">文件系统, UUID, 关联</text>
            </g>

            <!-- Bottom Layer Components - Adjusted for alignment and internal blocks -->
            <!-- SQLite + vec0 -->
            <g class="db-color-new" filter="url(#dropshadow)">
                <rect x="40" y="600" width="235" height="130" class="box"/>
                <text x="157.5" y="625" class="main-text">数据库</text>
                <text x="157.5" y="643" class="sub-text">SQLite + vec0</text>
                <rect x="55" y="655" width="205" height="30" class="bottom-internal-box"/>
                <text x="157.5" y="670" class="bottom-internal-main-text">元数据, 文本/图像向量</text>
                <rect x="55" y="690" width="205" height="30" class="bottom-internal-box"/>
                <text x="157.5" y="705" class="bottom-internal-main-text">传统与向量检索</text>
            </g>

            <!-- Jina CLIP V2 -->
            <g class="model-color-new" filter="url(#dropshadow)">
                <rect x="295" y="600" width="235" height="130" class="box"/>
                <text x="412.5" y="625" class="main-text">向量模型</text>
                <text x="412.5" y="643" class="sub-text">Jina CLIP V2</text>
                <rect x="310" y="655" width="205" height="30" class="bottom-internal-box"/>
                <text x="412.5" y="670" class="bottom-internal-main-text">文本/图像向量化</text>
                <rect x="310" y="690" width="205" height="30" class="bottom-internal-box"/>
                <text x="412.5" y="705" class="bottom-internal-main-text">多种匹配模式</text>
            </g>

            <!-- 硅基流动 API -->
            <g class="api-color-new" filter="url(#dropshadow)">
                <rect x="550" y="600" width="235" height="130" class="box"/>
                <text x="667.5" y="625" class="main-text">多模态 API</text>
                <text x="667.5" y="643" class="sub-text">硅基流动模型 API</text>
                <rect x="565" y="655" width="205" height="30" class="bottom-internal-box"/>
                <text x="667.5" y="670" class="bottom-internal-main-text">智能标题, 描述, 标签</text>
                <rect x="565" y="690" width="205" height="30" class="bottom-internal-box"/>
                <text x="667.5" y="705" class="bottom-internal-main-text">批量与个性化处理</text>
            </g>

            <!-- File System -->
            <g class="storage-color-new" filter="url(#dropshadow)">
                <rect x="805" y="600" width="235" height="130" class="box"/>
                <text x="922.5" y="625" class="main-text">文件系统</text>
                <text x="922.5" y="643" class="sub-text">本地图片存储</text>
                <rect x="820" y="655" width="205" height="30" class="bottom-internal-box"/>
                <text x="922.5" y="670" class="bottom-internal-main-text">UUID命名, 日期组织</text>
                <rect x="820" y="690" width="205" height="30" class="bottom-internal-box"/>
                <text x="922.5" y="705" class="bottom-internal-main-text">优化图片访问</text>
            </g>

            <!-- Connectors -->
            <!-- User <-> Frontend -->
            <line x1="550" y1="80" x2="550" y2="110" class="bi-connector" />
            <text x="560" y="100" class="desc-text" style="text-anchor: start; fill: #455A64;">用户交互</text>

            <!-- Frontend <-> Backend API -->
            <line x1="550" y1="220" x2="550" y2="250" class="bi-connector" />
            <text x="560" y="240" class="desc-text" style="text-anchor: start; fill: #455A64;">API 请求/响应</text>

            <!-- Backend API to Bottom Layer (Curved Connectors, arrowheads for clarity) -->
            <!-- Backend to SQLite -->
            <path d="M 550,530 Q 353,580 157.5,600" class="arrowed-connector" /> 
            <text x="353" y="570" class="desc-text" style="fill: #455A64;">数据存储与检索</text>

            <!-- Backend to Jina CLIP V2 -->
            <path d="M 550,530 Q 481,580 412.5,600" class="arrowed-connector" /> 
            <text x="481" y="570" class="desc-text" style="fill: #455A64;">向量生成</text>

            <!-- Backend to 硅基流动 API -->
            <path d="M 550,530 Q 609,580 667.5,600" class="arrowed-connector" /> 
            <text x="609" y="570" class="desc-text" style="fill: #455A64;">智能内容生成</text>

            <!-- Backend to File System -->
            <path d="M 550,530 Q 737,580 922.5,600" class="arrowed-connector" /> 
            <text x="737" y="570" class="desc-text" style="fill: #455A64;">图片文件操作</text>

            <!-- Overall System Title -->
            <text x="550" y="820" font-size="20" font-weight="bold" text-anchor="middle" fill="#263238">SmartImageFinder 智能图片管理与检索系统架构</text>
            <text x="550" y="850" font-size="12" text-anchor="middle" fill="#546E7A">本地桌面 Web 应用-个人版 </text>

        </svg>
    </div>
</body>
</html>
